<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#2e7d32" />
<title>ViCare + Fancoil</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 400px; margin: 60px auto; padding: 0 16px; color: #1a1a1a; text-align: center; }
  h1 { font-size: 1.3rem; }
  button { display: block; width: 100%; padding: 18px; margin: 10px 0; border-radius: 10px; border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; font-size: 1.1rem; }
  button:hover { background: #eaeaea; }
  button.on { background: #2e7d32; color: white; border-color: #2e7d32; }
  button.off { background: #c62828; color: white; border-color: #c62828; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #room-temp-value { font-size: 1.6rem; font-weight: bold; margin: 8px 0 0; }
  pre { background: #f7f7f7; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; text-align: left; }
  .note { font-size: 0.85rem; color: #777; margin-top: 24px; }
  .note a { color: #777; }
</style>
</head>
<body>
  <h1>ViCare + Fancoil (FT4W)</h1>

  <div id="status-value" style="font-weight:bold; margin-bottom:12px; color:#555;">Estat: —</div>

  <button class="on" onclick="callApi('POST', '/api/start', {}, 'out').then(delayedRefresh)">Engegar</button>
  <button class="off" onclick="callApi('POST', '/api/stop', {}, 'out').then(delayedRefresh)">Aturar</button>
  <button id="room-temp-btn" onclick="getRoomTemp()">Consultar temperatura sala</button>
  <div id="room-temp-value"></div>

  <div style="margin-top:16px; text-align:left; color:#555;" id="setpoint-value">Consigna: —</div>
  <div style="display:flex; gap:8px; margin-top:8px;">
    <input type="number" id="vicare-temp" step="1" min="10" max="30" placeholder="°C consigna (10-30)" style="flex:1; padding:12px; border-radius:8px; border:1px solid #ccc; font-size:1rem;" />
    <button style="width:auto; margin:0;" onclick="setVicareTemp()">Canviar</button>
  </div>

  <pre id="out"></pre>

  <div class="note"><a href="/auth/vicare">Reconnectar ViCare</a> (només si cal tornar a fer login)</div>

<script>
async function callApi(method, url, body, outId) {
  const res = await fetch(url, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  document.getElementById(outId).textContent = JSON.stringify(clean(data), null, 2);
}

// Treu els camps null/undefined perquè l'output es vegi net
function clean(obj) {
  if (Array.isArray(obj)) return obj.map(clean);
  if (obj && typeof obj === 'object') {
    const out = {};
    for (const [k, v] of Object.entries(obj)) {
      if (v === null || v === undefined) continue;
      out[k] = clean(v);
    }
    return out;
  }
  return obj;
}

function setVicareTemp() {
  const val = parseFloat(document.getElementById('vicare-temp').value);
  if (Number.isNaN(val)) return alert('Introdueix un número vàlid');
  // Mostra el valor a l'instant (ja el sabem) i confirma amb el servidor una mica després
  document.getElementById('setpoint-value').textContent = 'Consigna: ' + val + ' °C';
  callApi('POST', '/api/vicare/temperature', { temperature: val }, 'out')
    .then(() => setTimeout(getSetpointTemp, 3000));
}

async function getSetpointTemp() {
  const res = await fetch('/api/vicare/setpoint-temperature');
  const data = await res.json();
  const el = document.getElementById('setpoint-value');
  if (data.value != null) {
    el.textContent = 'Consigna: ' + data.value + ' °C';
  } else {
    el.textContent = 'Consigna: —';
    document.getElementById('out').textContent = JSON.stringify(data, null, 2);
  }
}

async function getStatus() {
  const res = await fetch('/api/vicare/mode');
  const data = await res.json();
  const el = document.getElementById('status-value');
  if (data.isOn === true) {
    el.textContent = 'Estat: Engegat';
    el.style.color = '#2e7d32';
  } else if (data.isOn === false) {
    el.textContent = 'Estat: Aturat';
    el.style.color = '#c62828';
  } else {
    el.textContent = 'Estat: desconegut (' + (data.mode || '?') + ')';
    el.style.color = '#777';
  }
}

function refreshAll() {
  getStatus();
  getRoomTemp();
  getSetpointTemp();
}

// Després d'engegar/aturar, Viessmann triga uns segons a aplicar el canvi;
// esperem una mica abans de tornar a consultar l'estat perquè ja el reflecteixi.
function delayedRefresh() {
  document.getElementById('status-value').textContent = 'Estat: actualitzant…';
  document.getElementById('status-value').style.color = '#777';
  setTimeout(refreshAll, 8000);
}

async function getRoomTemp() {
  const res = await fetch('/api/vicare/room-temperature');
  const data = await res.json();
  const el = document.getElementById('room-temp-value');
  const btn = document.getElementById('room-temp-btn');
  if (data.value != null) {
    el.textContent = 'Temperatura sala: ' + data.value + ' °C';
    btn.style.display = 'none';
  } else {
    el.textContent = '';
    btn.style.display = '';
    document.getElementById('out').textContent = JSON.stringify(data, null, 2);
  }
}
// Carrega l'estat, la temperatura de sala i la consigna en obrir la pàgina,
// i ho refresca sol cada minut
refreshAll();
setInterval(refreshAll, 60000);
</script>
</body>
</html>
