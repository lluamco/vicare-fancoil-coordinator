<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ViCare + Fancoil</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  section { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  button { padding: 10px 16px; margin: 4px 4px 4px 0; border-radius: 6px; border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; font-size: 1rem; }
  button:hover { background: #eaeaea; }
  button.on { background: #2e7d32; color: white; border-color: #2e7d32; }
  button.off { background: #c62828; color: white; border-color: #c62828; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  pre { background: #f7f7f7; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
  .note { font-size: 0.85rem; color: #777; margin-top: 8px; }
</style>
</head>
<body>
  <h1>ViCare + Fancoil (FT4W)</h1>

  <section>
    <h2>Tots dos</h2>
    <button class="on" onclick="callApi('POST', '/api/start', {}, 'out-all')">Engegar tot</button>
    <button class="off" onclick="callApi('POST', '/api/stop', {}, 'out-all')">Aturar tot</button>
    <pre id="out-all"></pre>
  </section>

  <section>
    <h2>ViCare</h2>
    <a href="/auth/vicare"><button>Connectar ViCare</button></a>
    <div>
      <button class="on" onclick="callApi('POST', '/api/vicare/start', {}, 'out-vicare')">Engegar</button>
      <button class="off" onclick="callApi('POST', '/api/vicare/stop', {}, 'out-vicare')">Aturar</button>
      <button onclick="callApi('GET', '/api/vicare/status', null, 'out-vicare')">Consultar estat</button>
    </div>
    <div style="margin-top:8px;">
      <input type="number" id="vicare-temp" step="1" min="10" max="30" placeholder="°C (10-30)" style="width:90px; padding:8px;" />
      <button onclick="setVicareTemp()">Canviar temperatura</button>
    </div>
    <div style="margin-top:8px;">
      <button onclick="getRoomTemp()">Consultar temperatura de sala</button>
      <span id="room-temp-value" style="margin-left:8px; font-weight:bold;"></span>
    </div>
    <pre id="out-vicare"></pre>
  </section>

  <section>
    <h2>Fancoil (Tuya)</h2>
    <div id="tuya-note" class="note"></div>
    <div>
      <button class="on" onclick="callApi('POST', '/api/tuya/start', {}, 'out-tuya')">Engegar</button>
      <button class="off" onclick="callApi('POST', '/api/tuya/stop', {}, 'out-tuya')">Aturar</button>
      <button onclick="callApi('GET', '/api/tuya/status', null, 'out-tuya')">Consultar estat</button>
    </div>
    <pre id="out-tuya"></pre>
  </section>

<script>
async function callApi(method, url, body, outId) {
  const res = await fetch(url, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  document.getElementById(outId).textContent = JSON.stringify(clean(data), null, 2);
}

// Treu els camps null/undefined perquè l'output es vegi net
function clean(obj) {
  if (Array.isArray(obj)) return obj.map(clean);
  if (obj && typeof obj === 'object') {
    const out = {};
    for (const [k, v] of Object.entries(obj)) {
      if (v === null || v === undefined) continue;
      out[k] = clean(v);
    }
    return out;
  }
  return obj;
}

function setVicareTemp() {
  const val = parseFloat(document.getElementById('vicare-temp').value);
  if (Number.isNaN(val)) return alert('Introdueix un número vàlid');
  callApi('POST', '/api/vicare/temperature', { temperature: val }, 'out-vicare');
}

async function getRoomTemp() {
  const res = await fetch('/api/vicare/room-temperature');
  const data = await res.json();
  const el = document.getElementById('room-temp-value');
  if (data.value != null) {
    el.textContent = data.value + ' °C';
  } else {
    el.textContent = '(no disponible)';
    document.getElementById('out-vicare').textContent = JSON.stringify(data, null, 2);
  }
}

async function checkTuyaConfigured() {
  try {
    const res = await fetch('/api/tuya-configured');
    const { configured } = await res.json();
    if (!configured) {
      document.getElementById('tuya-note').textContent =
        'Encara no has configurat el dispositiu Tuya a .env (TUYA_ACCESS_ID / TUYA_DEVICE_ID). Els botons fallaran fins que ho facis.';
    }
  } catch {}
}
checkTuyaConfigured();
</script>
</body>
</html>
